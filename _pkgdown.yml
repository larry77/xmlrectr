url: https://larry77.github.io/xmlrectr/

template:
  bootstrap: 5

home:
  title: xmlrectr — generic XML rectangling for R
  description: Rectangle arbitrary XML into analysis-friendly tables with reviewable profiles, streaming and automatic parallel execution.

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

articles:
- title: Workflows
  navbar: Workflows
  contents:
  - getting-started
  - large-xml
  - development

