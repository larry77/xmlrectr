  desc: Canonical readers and structural inspection.
  contents:
  - xml_nodes_schema
  - xml_to_nodes_memory
  - xml_text_to_nodes_memory
  - xml_stream_nodes
  - xml_to_nodes_stream
  - validate_xml_nodes
  - xml_node_children
  - inspect_xml

- title: Proposals and profiles
  desc: Review structural evidence and define reusable extraction contracts.
  contents:
  - propose_xml_profile
